<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>宠物天地｜BUGTI</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/pet-home.css">
</head>
<body data-nav="pet">
  <main class="app-shell pet-page">
    <header class="pet-header">
      <div>
        <div class="pet-eyebrow">PET WORLD</div>
        <h1>监工小屋</h1>
      </div>
      <div class="pet-tools" aria-label="宠物工具">
        <a id="focus-pill" class="pet-pill" href="./focus.html"><b>FOCUS</b><span id="focus-pill-value">0 min</span></a>
        <button class="pet-pill" type="button" data-panel="manage"><b>MANAGE</b><span>监工管理</span></button>
        <button class="pet-pill" type="button" data-panel="plan"><b>PLAN</b><span id="plan-pill-value">0 / 0</span></button>
      </div>
    </header>

    <section id="room-stage" class="room-stage" aria-label="监工小屋互动场景">
      <img class="room-background" src="./assets/pet/room/pet_room_base.png" alt="监工小屋">
      <button id="room-board" class="room-board" type="button" data-panel="status" aria-label="查看今日运行状态">
        <img src="./assets/pet/room/pet_room_status_board.png" alt="">
        <span id="board-copy" class="room-board-copy">FULL POWER<br>PLAN 0 / 0</span>
      </button>
      <div id="room-pets" class="room-pets"></div>
      <div id="collision-fx" class="collision-fx" aria-hidden="true"></div>
      <button id="room-desk" class="room-desk" type="button" data-panel="plan" aria-label="打开今日计划">
        <img src="./assets/pet/room/pet_room_desk.png" alt="">
      </button>
      <button id="teaser-wand" class="teaser-wand" type="button" aria-label="拖动逗猫棒">
        <img src="./assets/pet/room/pet_room_teaser_wand.png" alt="">
      </button>
      <div id="pet-bubble" class="pet-bubble is-hidden" role="status"></div>
      <div id="room-empty" class="room-empty is-hidden">
        <strong>小屋还没有监工</strong>
        <span>先添加一位监工，才能使用陪学和逗猫棒。</span>
        <a href="./index.html?monitor=add&amp;return=pet-home">添加监工</a>
      </div>
    </section>

    <p class="room-hint">拖动逗猫棒，监工会追过来；点一下监工，它会回应你。</p>
  </main>

  <div id="panel-backdrop" class="panel-backdrop is-hidden" aria-hidden="true">
    <section id="plan-panel" class="pet-sheet is-hidden" aria-labelledby="plan-title">
      <div class="sheet-handle"></div>
      <header class="sheet-header">
        <div><div class="pet-eyebrow">TODAY'S PLAN</div><h2 id="plan-title">今日计划</h2></div>
        <strong id="plan-count">0 / 0</strong>
      </header>
      <form id="plan-form" class="plan-form">
        <input id="plan-input" maxlength="40" placeholder="今天准备干掉什么？" autocomplete="off">
        <button type="submit">添加</button>
      </form>
      <div id="plan-list" class="plan-list"></div>
      <p id="plan-empty" class="sheet-empty">今天还没有计划。</p>
      <button class="sheet-close" type="button" data-close-panel>收起来</button>
    </section>

    <section id="manage-panel" class="pet-sheet is-hidden" aria-labelledby="manage-title">
      <div class="sheet-handle"></div>
      <header class="sheet-header">
        <div><div class="pet-eyebrow">MONITORS</div><h2 id="manage-title">监工管理</h2></div>
        <strong id="manage-count">0 / 3</strong>
      </header>
      <div id="manage-list" class="manage-list"></div>
      <a id="manage-add" class="manager-add" href="./index.html?monitor=add&amp;return=pet-home">＋ 添加一个监工</a>
      <p id="manage-limit" class="sheet-empty is-hidden">房间最多住 3 个监工，避免走路时挤成一团。</p>
      <button class="sheet-close" type="button" data-close-panel>收起来</button>
    </section>

    <section id="status-panel" class="pet-sheet is-hidden" aria-labelledby="status-title">
      <div class="sheet-handle"></div>
      <header class="sheet-header">
        <div><div class="pet-eyebrow">SYSTEM STATUS</div><h2 id="status-title">今日运行状态</h2></div>
        <strong id="status-code">NO DATA</strong>
      </header>
      <div class="status-grid">
        <div class="status-cell"><span>计划</span><strong id="status-plan">0 / 0</strong></div>
        <div class="status-cell"><span>专注</span><strong id="status-focus">0 min</strong></div>
        <div class="status-cell"><span>番茄</span><strong id="status-sessions">0</strong></div>
        <div class="status-cell"><span>监工</span><strong id="status-monitors">0 / 3</strong></div>
      </div>
      <button class="sheet-close" type="button" data-close-panel>知道了</button>
    </section>
  </div>

  <script type="module" src="./js/pages/pet-home.js"></script>
  <script type="module" src="./js/shared/nav.js"></script>
</body>
</html>
