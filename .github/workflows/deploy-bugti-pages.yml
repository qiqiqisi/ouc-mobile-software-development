name: Deploy BUGTI and Lab04 Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-site

      - name: Checkout lab04
        uses: actions/checkout@v6
        with:
          ref: lab04
          path: lab04-source

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/lab04
          cp -a main-site/web/. _site/
          cp -a lab04-source/web/. _site/lab04/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Web
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
